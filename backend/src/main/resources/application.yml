server:
  port: 8080

spring:
  application:
    name: community
  # 本地开发凭据从根目录 .env 读取（gitignored）；兼容从 backend/ 或仓库根目录启动
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:172.25.41.137}:${MYSQL_PORT:3306}/${MYSQL_DB:community}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:community}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:172.25.41.137}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

community:
  jwt:
    # HS256 密钥，至少 32 字节；缺失或过短时应用拒绝启动
    secret: ${JWT_SECRET:}
    access-ttl-minutes: 30
    refresh-ttl-days: 7
  oauth:
    # OAuth Token AES-256-GCM 加密密钥（Base64 的 32 字节）；缺失时应用拒绝启动
    aes-key: ${OAUTH_AES_KEY:}
    # OAuth 回调基地址：dev 用前端源，prod 用域名（域名就绪后改）
    redirect-base-url: ${OAUTH_REDIRECT_BASE_URL:http://localhost:5173}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
    gitee:
      client-id: ${GITEE_CLIENT_ID:}
      client-secret: ${GITEE_CLIENT_SECRET:}
  event:
    # Agent webhook 推送地址（联调期 Agent 在 WSL2 宿主端口 18000）
    agent-url: ${AGENT_WEBHOOK_URL:http://172.25.41.137:18000/api/v1/events}
    # HMAC-SHA256 共享密钥（32 字节随机，线下交换给 Agent PM）
    webhook-secret: ${STEWARD_WEBHOOK_SECRET:ci-only-placeholder-for-hmac-bean-32bytes!!}
    # Webhook RestTemplate 超时（缺省会饿死默认 @Async 线程池，拖死站内通知）
    connect-timeout-ms: ${WEBHOOK_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${WEBHOOK_READ_TIMEOUT_MS:3000}
  media:
    # MinIO / S3 兼容端点（dev 默认宿主机暴露的 9000；prod 容器内 http://minio:9000）
    endpoint: ${MINIO_ENDPOINT:http://172.25.41.137:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: ${MINIO_BUCKET:geekstack}
    # 对外可读 URL 前缀（不含尾斜杠）；dev nginx:9080 /media/ ，prod 站点 /media/
    public-base-url: ${MINIO_PUBLIC_BASE_URL:http://172.25.41.137:9080}
    rate-limit-per-minute: ${MEDIA_RATE_LIMIT_PER_MINUTE:20}
  rag:
    enabled: ${RAG_ENABLED:true}
    source-system: geekstack
    chunk-size-tokens: 512
    chunk-overlap-tokens: 50
    embedding-model: text-embedding-v3
    embedding-dim: 1024
    dashscope-api-key: ${DASHSCOPE_API_KEY:}
    dashscope-base-url: ${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
    # memory = 进程内（本地/测试）；联调改为 http://127.0.0.1:6333
    qdrant-url: ${QDRANT_URL:memory}
    qdrant-collection: ${QDRANT_COLLECTION:geekstack_community}
    public-base-url: ${RAG_PUBLIC_BASE_URL:http://localhost:5173}
    connect-timeout-ms: ${RAG_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${RAG_READ_TIMEOUT_MS:5000}
    max-retries: 2
    seed-help-on-startup: ${RAG_SEED_HELP:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 日志落盘：控制台 + 文件双写（生产挂载 /app/logs；ERROR 级别单独留痕）
logging:
  file:
    name: /app/logs/community.log
  logback:
    rollingpolicy:
      file-name-pattern: /app/logs/community.%d{yyyy-MM-dd}.%i.log
      max-file-size: 20MB
      max-history: 14
      total-size-cap: 500MB
  level:
    root: INFO
