server:
  port: 8080

spring:
  application:
    name: community
  # 本地开发凭据从根目录 .env 读取（gitignored）；兼容从 backend/ 或仓库根目录启动
  config:
    import: "optional:file:./.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:172.25.41.137}:${MYSQL_PORT:3306}/${MYSQL_DB:community}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:community}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:172.25.41.137}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

community:
  jwt:
    # HS256 密钥，至少 32 字节；缺失或过短时应用拒绝启动
    secret: ${JWT_SECRET:}
    access-ttl-minutes: 30
    refresh-ttl-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health,info
