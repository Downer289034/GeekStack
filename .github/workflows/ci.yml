name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ciroot
          MYSQL_DATABASE: community
          MYSQL_USER: community
          MYSQL_PASSWORD: community
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pciroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_DB: community
      MYSQL_USER: community
      MYSQL_PASSWORD: community
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-only-jwt-secret-not-for-production-0123456789abcdef
      OAUTH_AES_KEY: KvHeyXDrI3JbB+9d7v2ONcHPe1rpGDUR3iMUcIVDYAQ=
      STEWARD_WEBHOOK_SECRET: ci-only-webhook-secret-32-bytes-hex-0123456789abcdef
      # 端口 9（discard）快速拒绝，避免 CI runner 连私网 IP 黑洞饿死 @Async 线程池
      AGENT_WEBHOOK_URL: http://127.0.0.1:9/api/v1/events
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Checkstyle + Build + Tests
        working-directory: backend
        run: mvn -B verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check & Build
        working-directory: frontend
        run: npm run build

  # T-AI-5：ai-service 检索三分支单测（无 Key、秒级）
  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-service/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest tests.test_retrieve -v
        env:
          QDRANT_URL: ":memory:"
          QDRANT_COLLECTION: geekstack_community
          MIMO_THINKING: disabled
