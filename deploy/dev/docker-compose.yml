# 开发基础设施：MySQL 8 + Redis 7 + MinIO + Qdrant + ai-service（T-AI-5）
# 部署位置：服务器 /opt/community-dev/docker-compose.yml（开发栈；生产栈见 deploy/prod）
# 凭据来自同目录 .env（服务器上 chmod 600，不入 git）
# 本机 Java/前端连：172.25.41.137 的 3306/6379/9000/9080/6333/8090
services:
  mysql:
    image: mysql:8.0
    container_name: community-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: community
      MYSQL_USER: community
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: community-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  # M7-2：对象存储；dev 暴露 9000 供本机调试（控制台 9001 仅本机）
  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: community-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      # 凭据仅来自同目录 .env（不入 git）；禁止在 compose 写默认密码
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: community-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-geekstack}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD;
      mc mb -p local/$$MINIO_BUCKET || true;
      mc anonymous set download local/$$MINIO_BUCKET/media || true;
      echo minio-init-done;
      "

  # 仅反代 /media/ → MinIO（9080，避开 prod 的 80）
  nginx:
    image: nginx:1.27-alpine
    container_name: community-nginx-media
    restart: unless-stopped
    ports:
      - "9080:80"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      minio:
        condition: service_healthy

  # T-AI-5：社区向量库（Java 写、ai-service 读；collection 默认 geekstack_community）
  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: community-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage

  # T-AI-5：问答服务。部署时把仓库 ai-service/ 同步到本目录下的 ai-service/（见 sync-ai-stack.sh）
  ai-service:
    image: geekstack/ai-service:latest
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: community-ai-service
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      MIMO_API_KEY: ${MIMO_API_KEY:-}
      MIMO_BASE_URL: ${MIMO_BASE_URL:-https://api.xiaomimimo.com/v1}
      MIMO_MODEL: ${MIMO_MODEL:-mimo-v2.5}
      MIMO_THINKING: ${MIMO_THINKING:-disabled}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_BASE_URL: ${DASHSCOPE_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-v3}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-geekstack_community}
      RETRIEVE_TOP_K: ${RETRIEVE_TOP_K:-5}
      RETRIEVE_SCORE_THRESHOLD: ${RETRIEVE_SCORE_THRESHOLD:-0.35}
      TZ: Asia/Shanghai
    depends_on:
      - qdrant
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 25s

volumes:
  # 钉死历史卷名，避免 compose project 解析变化时新建空卷冲掉开发数据
  mysql-data:
    name: community-dev_mysql-data-dev
  redis-data:
    name: community-dev_redis-data-dev
  minio-data:
  qdrant-data:
    name: community-dev_qdrant-data-dev
