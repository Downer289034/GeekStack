# 极客栈 GeekStack 前端 + API 反代
# HTTP 80 先行（HTTPS 证书签发后自动跳转，见 443 配置注释）
server {
    listen 80;
    server_name _;

    # certbot HTTP-01 验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 前端静态资源（HTML5 history 路由回退到 index.html）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 反代到后端容器
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
    }
}

# HTTPS 就绪后（certbot 签发成功）：
# 1) 本文件中追加 443 server 块（ssl_certificate /etc/letsencrypt/live/<域名>/fullchain.pem）
# 2) 80 端口 server 除 acme-challenge 外 301 跳转 https
# 由 deploy/prod/setup-https.sh 自动完成
